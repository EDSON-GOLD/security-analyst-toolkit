title: SQLi Auth Bypass Attempt - Single Quote in Login Username
id: 7d25465e-5085-401e-8781-cf2451b41be0
status: experimental
description: Failed login where the username contains a single quote, indicating an attempted (unsuccessful) SQL injection authentication bypass
references:
  - https://owasp.org/Top10/A03_2021-Injection/  # อ้างอิง
author: EDSON                          # ผู้สร้าง
date: 2026/06/01                       # วันที่สร้าง
logsource:
  product: vuln-lab                    # product: vuln-lab
  service: auth                        #เซอร์วิสยืนยันตัวตน
detection: 
  selection:                           # เงื่อนไข
    event: login_attempt               # ค้นหา event ที่ผ่านการ login_attempt 
    username|contains: "'"             # ค้นหา username ที่มีอักขระพิเศษ " ' " 
    result: failed                     # ค้นหา สถานะการ login ไม่สำเร็จ
  condition: selection                 # เงื่อนไข การค้นหา
falsepositives:                        # เงื่อนไขยกเว้น
  - Legitimate usernames containing an apostrophe (e.g. O'Brien) - mitigated if registration blocks "'"
level: medium                          #ลำดับความสำคัญเฝ้าระวัง
tags:
  - attack.initial_access